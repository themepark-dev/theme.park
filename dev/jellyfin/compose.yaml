name: themepark-jellyfin-dev
services:
  proxy:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:18087:80"]
    depends_on: [jellyfin, css]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  jellyfin:
    image: jellyfin/jellyfin:12.0
    ports: ["127.0.0.1:18086:8096"]
    volumes:
      - config:/config
      - cache:/cache
      - ../artifacts/jellyfin/724/media:/media:ro
  css:
    image: python:3.12-alpine
    working_dir: /site
    command: ["python", "/serve.py"]
    ports: ["127.0.0.1:18869:8000"]
    volumes:
      - ../../css:/site/css:ro
      - ../../resources:/site/resources:ro
      - ../serve.py:/serve.py:ro
volumes:
  config:
  cache:

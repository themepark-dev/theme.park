map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;

    location /web/ {
        proxy_pass http://jellyfin:8096;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="http://localhost:18869/css/base/jellyfin/jellyfin-base.css"><link rel="stylesheet" href="http://localhost:18869/css/theme-options/aquamarine.css"></head>';
        sub_filter_once on;
        add_header Cache-Control "no-store";
    }

    # API, media, and WebSocket responses do not need HTML injection.
    location / {
        proxy_pass http://jellyfin:8096;
    }
}
